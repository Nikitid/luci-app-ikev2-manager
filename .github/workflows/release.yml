name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege by default; the job that publishes the release widens it.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # release-notes.sh reads the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify tag
        run: ./scripts/check-release-tag.sh "${GITHUB_REF_NAME}"
      - name: Install ucode build dependencies
        run: sudo apt-get install -y --no-install-recommends cmake libjson-c-dev
      - name: Validate and build
        run: ./scripts/ci-check.sh
      - name: Install OpenWrt SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential file gawk gettext libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev zstd
      - name: Download verified OpenWrt 25.12 SDK
        run: |
          . ./apk-feed.env
          mkdir -p build
          curl --fail --location --silent --show-error \
            "https://downloads.openwrt.org/releases/${OPENWRT_APK_VERSION}/targets/${OPENWRT_APK_TARGET}/${OPENWRT_APK_SDK_ARCHIVE}" \
            --output "build/${OPENWRT_APK_SDK_ARCHIVE}"
          printf '%s  %s\n' \
            "$OPENWRT_APK_SDK_SHA256" "build/${OPENWRT_APK_SDK_ARCHIVE}" |
            sha256sum --check
          tar --use-compress-program=unzstd -xf \
            "build/${OPENWRT_APK_SDK_ARCHIVE}" -C build
      - name: Prepare APK release signing key
        env:
          SIGNING_KEY: ${{ secrets.OPENWRT_APK_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || {
            echo 'OPENWRT_APK_SIGNING_KEY is not configured' >&2
            exit 1
          }
          umask 077
          printf '%s\n' "$SIGNING_KEY" > /tmp/ikev2-manager-apk-release.pem
      # Only this package is built and signed here. Nikitid/openwrt-feed
      # collects the released APK and publishes the shared signed index, so a
      # release no longer depends on any sibling application being ready.
      - name: Build signed OpenWrt 25.12 APK
        run: |
          . ./apk-feed.env
          OPENWRT_SDK_DIR="$PWD/build/${OPENWRT_APK_SDK_ARCHIVE%.tar.zst}" \
          OPENWRT_APK_SIGNING_KEY=/tmp/ikev2-manager-apk-release.pem \
            ./scripts/build-apk.sh
      - name: Remove APK release signing key
        if: ${{ always() }}
        run: rm -f /tmp/ikev2-manager-apk-release.pem
      - name: Write release notes
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"
      - name: Publish release assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(github.ref_name, '_rc') || contains(github.ref_name, '_beta') || contains(github.ref_name, '_alpha') }}
          files: |
            dist/*.ipk
            dist/SHA256SUMS
            dist/apk/*
      # Best effort: the feed also rebuilds on a daily schedule and on manual
      # dispatch, so a missing or expired token delays the index but never
      # fails the release.
      - name: Notify the shared feed
        if: ${{ !contains(github.ref_name, '_rc') && !contains(github.ref_name, '_beta') && !contains(github.ref_name, '_alpha') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.OPENWRT_FEED_DISPATCH_TOKEN }}
        run: |
          . ./apk-feed.env
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'OPENWRT_FEED_DISPATCH_TOKEN is not configured;'
            echo 'the feed will pick this release up on its next scheduled run.'
            exit 0
          fi
          gh api "repos/${OPENWRT_FEED_REPOSITORY}/dispatches" \
            --method POST \
            --field event_type=member-release \
            --field "client_payload[repository]=${GITHUB_REPOSITORY}" \
            --field "client_payload[tag]=${GITHUB_REF_NAME}"

  # The desktop clients are built after the router package is published, so a
  # failure here never holds the package back.
  windows-client:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test and build the Windows client
        shell: powershell
        run: |
          $version = ($env:GITHUB_REF_NAME -replace '^v', '') -replace '_.*$', ''
          ./desktop-clients/windows/test.ps1
          ./desktop-clients/windows/build.ps1 -Output "$env:RUNNER_TEMP\client" -Version $version
      - name: Attach the installer to the release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "$env:RUNNER_TEMP\client\PrivateLaneSetup.exe" --clobber

  macos-client:
    needs: release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test and build the macOS client
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%_*}"
          swift test --package-path desktop-clients/macos
          desktop-clients/macos/build.sh "$version" "$RUNNER_TEMP/client"
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/client/PrivateLane-*.pkg --clobber
