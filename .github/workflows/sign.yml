name: Sign client release

# A release of the desktop clients whose installers were built and checked
# outside this repository: this workflow only signs their list with the client
# release key, which lives here. The branch sign/vX.Y.Z names the release; its
# draft must hold the installers. Nothing is built and no router package or
# feed is touched.
on:
  push:
    branches:
      - "sign/v*"

permissions:
  contents: read

jobs:
  sign-clients:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Sign the client release list
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_SIGNING_KEY: ${{ secrets.CLIENT_RELEASE_SIGNING_KEY }}
        run: |
          tag="${GITHUB_REF_NAME#sign/}"
          test -n "$CLIENT_SIGNING_KEY" || {
            echo 'CLIENT_RELEASE_SIGNING_KEY is not configured; refusing to publish an unsigned client list' >&2
            exit 1
          }
          work="$RUNNER_TEMP/client-release"
          mkdir -p "$work/files" "$work/out"
          gh release download "$tag" --dir "$work/files" \
            --pattern 'Waypoint-*.pkg' --pattern '*.msi' --pattern '*.exe'
          ls "$work"/files/*.msi >/dev/null
          (umask 077 && printf '%s\n' "$CLIENT_SIGNING_KEY" > "$work/key.pem")
          ./scripts/client-release-sign.sh list "$work"/files/* > "$work/out/Waypoint-SHA256SUMS"
          ./scripts/client-release-sign.sh sign "$work/out/Waypoint-SHA256SUMS" "$work/key.pem" "$work/out/Waypoint-SHA256SUMS.sig"
          rm -f "$work/key.pem"
          # Verified with the public key the installed clients carry, against
          # the files as the release holds them.
          ./scripts/client-release-sign.sh verify "$work/out/Waypoint-SHA256SUMS" "$work/out/Waypoint-SHA256SUMS.sig" keys/waypoint-client-release.pem "$work/files"
          cat "$work/out/Waypoint-SHA256SUMS"
          gh release upload "$tag" "$work/out/Waypoint-SHA256SUMS" "$work/out/Waypoint-SHA256SUMS.sig" --clobber
      - name: Remove the client signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/client-release/key.pem"
