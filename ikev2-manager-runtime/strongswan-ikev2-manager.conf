# Installed as /etc/strongswan.d/ikev2-manager.conf. strongswan.conf includes
# strongswan.d/charon/*.conf inside charon.plugins, so a charon section placed
# there becomes charon.plugins.charon and is silently ignored.
#
# The virtual IP stays on ipsec-out, where ikev2-sync-vips puts it. When charon
# installed it, it removed the address on every SA teardown, and sockets opened
# during an outage took the WAN address as their source.
charon {
	install_routes = no
	install_virtual_ip = no
	retry_initiate_interval = 15s
	# Packet and encoding detail (net, enc) is off: at the default level charon
	# writes a line for every packet and payload, which floods syslog on a
	# router with many tunnels. The ike and cfg groups keep the default level,
	# which is where handshake failures are reported.
	syslog {
		daemon {
			default = 1
			ike = 1
			cfg = 1
			net = 0
			enc = 0
		}
	}
	plugins {
		kernel-netlink {
			install_routes_xfrmi = no
		}
	}
}
